# Pasta raiz onde o software de downloads cria uma pasta por download.
watch.folder=/home/USUARIO/Downloads

# A pasta precisa permanecer sem alterações por este período antes do processamento.
folder.stable.seconds=60
folder.scan.interval.seconds=10

# Nunca coloque credenciais reais neste arquivo versionado.
telegram.bot.token=COLOQUE_O_TOKEN_AQUI
telegram.chat.id=COLOQUE_O_CHAT_ID_AQUI
# Alternativamente, use as variáveis TELEDROP_BOT_TOKEN e TELEDROP_CHAT_ID.

# Endpoint oficial: 50 MB atualmente; 45 MB deixa margem para multipart.
telegram.api.base.url=https://api.telegram.org
telegram.part.max.mb=45

# Para volumes de até aproximadamente 1.8 GB, use um Local Bot API Server:
# telegram.api.base.url=http://127.0.0.1:8081
# telegram.part.max.mb=1800
telegram.concurrent.uploads=1
telegram.retry.max=5
telegram.retry.delays.seconds=5,15,30,60,120
telegram.connect.timeout.seconds=30
telegram.request.timeout.seconds=86400

# Caminhos relativos são resolvidos a partir da pasta deste arquivo.
temp.folder=/home/USUARIO/Downloads/.telegram-upload
data.folder=./data

checksum.enabled=true
archive.buffer.kb=64
shutdown.await.seconds=30
